# 界外值種子：port 剛好**不**落在 256 的倍數上。
#
# 這裡刻意避開 256 的倍數：`_scale_port` 以 8 位元遮罩截斷後當除數，而
# 512 & 0xFF == 0 —— 那會直接觸發 ScaledPortCollapse，於是這個「種子」
# 本身就是一個失敗案例，變異引擎不需要做任何事就已經到終點。
# 1024 & 0xFF == 0 也一樣，因此取 513 與 1023 這種緊鄰的值：
# 變異只要在個位元上動一下就會跨過那個邊界，這才是界外值種子的用途。
[server]
port = 513
workers = 2
timeout_ms = 1000
tls = false

[client]
retries = 1
